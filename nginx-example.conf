

events {
    worker_connections   1024;
}

http {
  server {
    # fileroom chat
    listen 443 ssl;
    # CHANGE YOUR DOMAIN HERE:
    server_name <your.domain.here>;
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log;
    
    # IF NECESSARY, SET UP YOUR CERTIFICATES HERE:
    # <certificate-setup here>
    
    # UPDATE TO YOUR UPLOAD LIMIT:
    client_max_body_size 100M;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # WebSocket specific location
    location /ws/ {
      proxy_pass http://fileroom:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
    }

    # Change from try_files to proxy_pass
    location /static/js/sw.js {
      proxy_pass http://fileroom:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }


    location /manifest.json {
      proxy_pass http://fileroom:8000;
      add_header Cache-Control "no-cache";
      add_header "X-Forwarded-Proto" "https";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Host $host;
    }

    location /share {
      proxy_pass http://fileroom:8000;
      proxy_http_version 1.1;
      
      # Preserve headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # CRITICAL: Don't buffer - pass through immediately
      proxy_request_buffering off;
      proxy_buffering off;
      
      # CRITICAL: Preserve Content-Type (multipart/form-data)
      proxy_set_header Content-Type $content_type;
      proxy_pass_request_body on;
      
      # Large file uploads
      client_max_body_size 100M;
      proxy_connect_timeout 300;
      proxy_send_timeout 300;
      proxy_read_timeout 300;
    }


    # Regular HTTP traffic
    location / {
      proxy_pass http://fileroom:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Allow large file uploads
      client_max_body_size 100M;
      
      # Increase timeouts for large uploads
      proxy_connect_timeout 300;
      proxy_send_timeout 300;
      proxy_read_timeout 300;
      send_timeout 300;
    }
  }
}
