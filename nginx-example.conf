

events {
    worker_connections   1024;
}

http {
  server {
    # fileroom chat
    listen 443 ssl;
    # CHANGE YOUR DOMAIN HERE:
    server_name <your.domain.here>;
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log;
    
    # IF NECESSARY, SET UP YOUR CERTIFICATES HERE:
    # <certificate-setup here>
    
    # UPDATE TO YOUR UPLOAD LIMIT (the app uploads one file per request; MAX_FILE_SIZE + some overhead):
    client_max_body_size 110M;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # WebSocket specific location
    location /ws/ {
      proxy_pass http://fileroom:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
    }

    # Service worker, version file and manifest must never be cached by the proxy,
    # otherwise installed apps cannot detect updates.
    location ~ ^/(sw\.js|version\.json|manifest\.(json|webmanifest))$ {
      proxy_pass http://fileroom:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
    }

    location /share {
      proxy_pass http://fileroom:8000;
      proxy_http_version 1.1;
      
      # Preserve headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # CRITICAL: Don't buffer - pass through immediately
      proxy_request_buffering off;
      proxy_buffering off;
      
      # CRITICAL: Preserve Content-Type (multipart/form-data)
      proxy_set_header Content-Type $content_type;
      proxy_pass_request_body on;
      
      # Files shared from other apps arrive in ONE request: allow the sum of all files
      # (keep in sync with MAX_SHARE_SIZE)
      client_max_body_size 500M;
      proxy_connect_timeout 300;
      proxy_send_timeout 300;
      proxy_read_timeout 300;
    }


    # Regular HTTP traffic
    location / {
      proxy_pass http://fileroom:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Allow large file uploads (one file per request)
      client_max_body_size 110M;
      proxy_request_buffering off;
      
      # Increase timeouts for large uploads
      proxy_connect_timeout 300;
      proxy_send_timeout 300;
      proxy_read_timeout 300;
      send_timeout 300;
    }
  }
}
